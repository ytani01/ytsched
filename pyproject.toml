[project]
name = "ytsched"
dynamic = ["version"]
description = "ytsched: YT Scheduler"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ytani01", email = "yoichi@tanibayashi.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "loguru>=0.7.3",
    "tornado>=6.5.2",
]

[project.scripts]
ytsched = "ytsched.__main__:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "mypy>=2.3.1",
    "playwright>=1.62.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ytsched"]

[tool.ruff]
line-length = 78
# archives/ は決着した項目の記録。ruff format は Markdown 中の python
# ブロックも整形するので、対象から外す (TODO-168)。
extend-exclude = ["archives"]

[tool.ruff.lint]
# 手帳代わりのソフトで、日付はすべて手元のローカル時刻。
# tz を付けて回ってもノイズにしかならないので、規則ごと除外する
# (TODO-015)。
ignore = ["DTZ005", "DTZ011"]
extend-select = ["I", "B", "SIM", "UP", "PTH"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "click,loguru,loguru.*,tornado,tornado.*,pytest,pytest.*,playwright,playwright.*"
ignore_missing_imports = true
follow_untyped_imports = true

# [tool.pytest.ini_options]
# addopts = "-v --cov=ytsched --cov-report=term-missing --cov-branch"

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingSuperCall = false
reportPossiblyUnboundVariable = "none"
reportMissingImports = "none"
reportOptionalCall = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportDuplicateImport = "warning"
reportUnreachable = "warning"
reportDeprecated = "warning"
useLibraryCodeForTypes = true
