[project]
name = "ytsched"
dynamic = ["version"]
description = "ytsched: YT Scheduler"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Yoichi Tanibayashi", email = "yoichi@tanibayashi.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "tornado>=6.5.2",
]

[project.scripts]
ytsched = "ytsched.__main__:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ytsched"]
