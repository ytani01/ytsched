[tools]
node = "26.8.1"

[tasks.upgradeproject]
description = "upgrade in this project"
run = '''
# upgrade this project

echo "# rm -f uv.lock"
rm -f uv.lock
echo "# uv sync"
uv sync

echo "# pip"
uv pip install -U -e .
uv pip install -U --group dev -e .

uv run ytsched --help
'''
alias = "uppj"

[tasks.fmt]
description = "format (ruff)"
run = '''
echo "# ruff format"
uv run ruff format src tests tools

echo "# ruff check"
uv run ruff check --fix src tests tools
'''

[tasks.typecheck]
description = "type check (basedpyright, mypy)"
run = '''
echo "# basedpyright"
uv run basedpyright src tests tools

echo "# mypy"
uv run mypy src tests tools
'''
# fmt も一緒に走るときは、整形が終わってから型を見る。
# typecheck だけを叩いたときは fmt は走らない。
wait_for = ["fmt"]

[tasks.fmtjs]
description = "format JavaScript (Prettier)"
run = "npx --no-install prettier --write src/ytsched/webroot/static/js"

[tasks.lintjs]
description = "lint JavaScript (ESLint)"
run = "npx --no-install eslint src/ytsched/webroot/static/js"
# lint でまとめて走るときは、整形が終わった .js を見る。
# lintjs だけを叩いたときは fmtjs は走らない（typecheck と fmt の関係と同じ）。
wait_for = ["fmtjs"]

[tasks.lint]
description = "linting (fmt, fmtjs, typecheck, lintjs)"
depends = ["fmt", "fmtjs", "typecheck", "lintjs"]

[tasks.test]
description = "test"
run = "uv run pytest tests"
depends = ["lint"]

[tasks.build]
description = "build"
run = '''
echo "# build"
rm -rf dist
uv build
'''
depends = ["test"]

[tasks.webapp]
description = "run web server"
# 既定は ~/ytsched/data・port 10085。
# 変えるときは `mise run webapp -- --port 10086` のように渡す
# （mise が引数を行の末尾へ足す）。
run = "uv run ytsched webapp"
alias = "web"

[tasks.tokens]
description = "token usage of a TODO item (TODO-035)"
# `mise run tokens -- TODO-034` のように TODO 番号を渡す
# （mise が引数を行の末尾へ足す）。`-- --list` で一覧。
run = "uv run python tools/token-usage.py"

[tasks.shot]
description = "screenshot of the webapp (TODO-046)"
# 先に `mise run webapp` などでアプリを起動しておくこと。
# `mise run shot -- --open -p todo047` のように渡す
# （mise が引数を行の末尾へ足す）。
# playwright は dev 依存に入っている（TODO-056）。
run = "uv run python tools/screenshot.py"

[tasks.figs]
description = "annotate screenshots for docs/User.md (TODO-152)"
# 先に `mise run shot` でキャプチャを撮っておくこと。
# 注釈の位置は tools/user-figs.json にある。
run = "uv run python tools/annotate.py"

[tasks.migrate]
description = "migrate old data (.cgi) to JSON Lines"
# `mise run migrate -- --dry-run` で確認できる。
run = "uv run ytsched migrate"
