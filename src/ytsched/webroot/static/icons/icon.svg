<?xml version="1.0" encoding="UTF-8"?>
<!--
  ytsched のアイコン (TODO-039)。
  青の角丸に白いカレンダー。青はメニューバーと同じ #48C。

  stroke="none" は ImageMagick の内蔵 SVG レンダラ (MSVG) 対策。
  指定しないと、塗りつぶした図形すべてに黒い輪郭が付く。
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512" stroke="none">
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#4488CC"/>
  <g id="calendar">
    <rect x="96" y="128" width="320" height="288" rx="32" ry="32" fill="#FFFFFF"/>
    <rect x="96" y="128" width="320" height="72" rx="32" ry="32" fill="#2E5F92"/>
    <rect x="96" y="176" width="320" height="24" fill="#2E5F92"/>
    <rect x="160" y="88" width="32" height="80" rx="16" ry="16" fill="#2E5F92"/>
    <rect x="320" y="88" width="32" height="80" rx="16" ry="16" fill="#2E5F92"/>
    <rect x="136" y="240" width="80" height="40" rx="8" ry="8" fill="#4488CC"/>
    <rect x="240" y="240" width="136" height="40" rx="8" ry="8" fill="#CCCCCC"/>
    <rect x="136" y="312" width="80" height="40" rx="8" ry="8" fill="#CCCCCC"/>
    <rect x="240" y="312" width="136" height="40" rx="8" ry="8" fill="#4488CC"/>
  </g>
</svg>
