<?xml version="1.0" encoding="UTF-8"?>
<!--
  画面で使うアイコン (TODO-048)。Font Awesome の代わりに自作したもの。

  24x24 の座標に、太さ 2 の線で描いた線画。塗りつぶしを使っているのは
  dot-circle の中心と circle-up-fill の 2 つだけ。

  線の描き方 (fill: none / stroke: currentColor / stroke-width: 2) は、
  このファイルではなく my.css の .my-icon にある。ここに <style> を
  置いても、外部ファイルを <use> で参照したときに適用しないブラウザが
  あるため (TODO-096)。塗りつぶしの 2 つだけは、継承より優先させたいので
  下の要素へ直接書いてある。

  参照のしかた:
    <svg class="my-icon"><use href=".../icons.svg#home"></use></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- 家: 今日へ戻る (main.html のメニューバー) -->
  <symbol id="home" viewBox="0 0 24 24">
    <path d="M3.5 11.2 12 3.8l8.5 7.4"/>
    <path d="M5.8 9.6V20h12.4V9.6"/>
    <path d="M9.8 20v-5.4h4.4V20"/>
  </symbol>

  <!-- 虫めがね: 検索 (main.html の検索欄・期間送り) -->
  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.4 15.4 20.5 20.5"/>
  </symbol>

  <!-- 三本線: メニューの開閉 (main.html) -->
  <symbol id="bars" viewBox="0 0 24 24">
    <path d="M3.5 6h17"/>
    <path d="M3.5 12h17"/>
    <path d="M3.5 18h17"/>
  </symbol>

  <!-- 山かっこ左: 前の週へ (main.html) -->
  <symbol id="chevron-left" viewBox="0 0 24 24">
    <path d="M15 4.5 7.5 12 15 19.5"/>
  </symbol>

  <!-- 山かっこ右: 次の週へ (main.html) -->
  <symbol id="chevron-right" viewBox="0 0 24 24">
    <path d="M9 4.5 16.5 12 9 19.5"/>
  </symbol>

  <!-- 下向きの山: 詳細の開閉 (sde.html) -->
  <symbol id="angle-down" viewBox="0 0 24 24">
    <path d="M5.5 9 12 15.5 18.5 9"/>
  </symbol>

  <!-- 漏斗: 絞り込み (main.html の filter) -->
  <symbol id="filter" viewBox="0 0 24 24">
    <path d="M3.5 4h17l-6.6 7.6V18l-3.8 2v-10.4Z"/>
  </symbol>

  <!-- 四角にチェック: 確定 (edit.html の fix) -->
  <symbol id="check-square" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
    <path d="M7.6 12.2 10.8 15.4 16.4 9"/>
  </symbol>

  <!-- 空の四角: ToDo の印 (sde.html)。check-square と外形をそろえた -->
  <symbol id="square" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
  </symbol>

  <!-- 丸に上矢印 (塗り): 検索を過去へ広げる (main.html)。
       輪郭の circle-up と外形をそろえ、中を塗って区別する -->
  <symbol id="circle-up-fill" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="none" fill-rule="evenodd"
          d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 1 0 0-19Z
             M12 6.6l5.6 5.6h-3.1v5.2h-5v-5.2H6.4Z"/>
  </symbol>

  <!-- 丸に上矢印 (輪郭): 日付を 1 日戻す (edit.html) -->
  <symbol id="circle-up" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M8 12.5 12 8.5l4 4"/>
    <path d="M12 8.8V16"/>
  </symbol>

  <!-- 丸に下矢印 (輪郭): 日付を 1 日進める (edit.html) -->
  <symbol id="circle-down" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M8 11.5 12 15.5l4-4"/>
    <path d="M12 15.2V8"/>
  </symbol>

  <!-- 丸に点: 今日の日付にする (edit.html) -->
  <symbol id="dot-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 左右の矢印: 検索する期間 (main.html) -->
  <symbol id="arrows-h" viewBox="0 0 24 24">
    <path d="M3 12h18"/>
    <path d="M7 7.5 2.5 12 7 16.5"/>
    <path d="M17 7.5 21.5 12 17 16.5"/>
  </symbol>

  <!-- 消去キー: 検索文字列を空にする (main.html) -->
  <symbol id="backspace" viewBox="0 0 24 24">
    <path d="M8.6 4.5H19a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8.6L2.6 12Z"/>
    <path d="M11.6 9.5 16.6 14.5"/>
    <path d="M16.6 9.5 11.6 14.5"/>
  </symbol>

  <!-- ゴミ箱: 削除 (edit.html) -->
  <symbol id="trash" viewBox="0 0 24 24">
    <path d="M3.5 6.5h17"/>
    <path d="M9.5 6.5V4.6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.9"/>
    <path d="M6.2 6.5 7.1 20.4h9.8L17.8 6.5"/>
    <path d="M10.4 10.4v6"/>
    <path d="M13.6 10.4v6"/>
  </symbol>

  <!-- 重なった二枚: 複製して足す (edit.html の add) -->
  <symbol id="clone" viewBox="0 0 24 24">
    <rect x="8.5" y="8.5" width="12" height="12" rx="2"/>
    <path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>
  </symbol>

  <!-- 回る二本の矢印: 更新 (edit.html の update) -->
  <symbol id="sync" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 0 1-13.7 5.7"/>
    <path d="M4 12a8 8 0 0 1 13.7-5.7"/>
    <path d="M17.7 2.5v3.8h-3.8"/>
    <path d="M6.3 21.5v-3.8h3.8"/>
  </symbol>

  <!-- 欠けた円: 読み込み中 (main.html / edit.html。回して使う) -->
  <symbol id="spinner" viewBox="0 0 24 24">
    <path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/>
  </symbol>

  <!-- 折れ曲がる矢印: 前の画面へ戻る (edit.html。今はコメントアウト) -->
  <symbol id="reply" viewBox="0 0 24 24">
    <path d="M9 6.5 3.5 12 9 17.5"/>
    <path d="M3.5 12h9.5a7 7 0 0 1 7 7v1.5"/>
  </symbol>

  <!-- 三角に感嘆符: 読み込みに失敗した (main.html) -->
  <symbol id="warning" viewBox="0 0 24 24">
    <path d="M12 3.6 22 20.6H2Z"/>
    <path d="M12 10.2v4.6"/>
    <path d="M12 17.8h.01"/>
  </symbol>

  <!-- 枠に横線: ToDo を出す日数 (main.html) -->
  <symbol id="list" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="16" rx="2.5"/>
    <path d="M7 9h10"/>
    <path d="M7 12.5h10"/>
    <path d="M7 16h6"/>
  </symbol>
</svg>
